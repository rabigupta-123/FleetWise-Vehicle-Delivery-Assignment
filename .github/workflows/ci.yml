name: FleetWise CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Lint (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Security & Secrets Check
        run: python scripts/check_secrets.py

      - name: Code Quality & Linting (Ruff)
        run: ruff check app tests

      - name: Static Type Verification (Pyrefly)
        run: pyrefly check --min-severity=warn

      - name: Math & KaTeX Formatting Check
        run: python scripts/check_math_syntax.py

      - name: Node.js Unit Tests (Battery States)
        run: node --test tests/test_battery_states.test.js

      - name: Pytest Integration & Physics Suite
        run: pytest -v --junitxml=junit.xml

      - name: Documentation Drift Verification
        run: python scripts/update_readme.py --check
